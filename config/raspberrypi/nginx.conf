# nginx/default.conf

# --- Cockpit ---
server {
    listen 80;
    server_name cockpit.pi dashboard.pi;

    location / {
        # Proxy requests to the host machine on port 9090
        proxy_pass http://host.docker.internal:9090;

        # Standard proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        # Required for websocket support which Cockpit uses
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # CHANGE 2: Tell Nginx to not verify Cockpit's self-signed certificate
        proxy_ssl_verify off;
    }
}

# --- Pi-hole ---
server {
    listen 80;
    server_name pihole.pi;

    location / {
        # Proxy requests to the Pi-hole container
        proxy_pass http://pihole:80;

        # Standard proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Required for Pi-hole v6+ to generate correct URLs
        proxy_set_header X-Forwarded-Host $host;
    }
}

# --- Portainer ---
server {
    listen 80;
    server_name portainer.pi;

    location / {
        # Proxy requests to the Portainer container (it listens on port 9000)
        proxy_pass http://portainer:9000;

        # Standard proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Required for websocket support (e.g., for container consoles)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

# --- PocketBase ---
server {
    listen 80;
    server_name pocketbase.pi;

    location / {
        # Proxy requests to the PocketBase container (it listens on port 8090)
        proxy_pass http://pocketbase:8090;

        # Standard proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# --- Memos ---
server {
    listen 80;
    server_name memo.pi;
    client_max_body_size 50M;

    location / {
        # Proxy requests to the Memos container (it listens on port 5230)
        proxy_pass http://memos:5230;

        # Standard proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# --- BentoPDF ---
server {
    listen 80;
    server_name pdf.pi;
    client_max_body_size 100M; # Accommodates larger PDF uploads

    location / {
        # Proxy requests to the BentoPDF container (it listens on port 80)
        proxy_pass http://bentopdf:8080;

        # Standard proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

