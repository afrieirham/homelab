services:
  pihole:
    container_name: pihole
    image: pihole/pihole:latest
    hostname: pihole
    ports:
      - "53:53/tcp"
      - "53:53/udp"
      - "8080:80/tcp"
      - "8443:443/tcp"
    environment:
      FTLCONF_dns_upstreams: "1.1.1.1;1.0.0.1"
      TZ: "Asia/Kuala_Lumpur"
      FTLCONF_dns_listeningMode: "all"
    volumes:
      - "/etc/pihole:/etc/pihole"
    cap_add:
      - SYS_NICE
    restart: unless-stopped