services:
  pihole:
    container_name: pihole
    image: pihole/pihole:latest
    hostname: pihole
    ports:
      # DNS Ports
      - "53:53/tcp"
      - "53:53/udp"
    environment:
      FTLCONF_dns_upstreams: "1.1.1.1;1.0.0.1"
      TZ: "Asia/Kuala_Lumpur"
      FTLCONF_webserver_api_password: ${ADMIN_PASSWORD}
      FTLCONF_dns_listeningMode: "all"
    volumes:
      - "/etc/pihole:/etc/pihole"
    cap_add:
      - SYS_NICE
    restart: unless-stopped

  portainer:
    container_name: portainer
    image: portainer/portainer-ce:lts
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data

  nginx-proxy:
    container_name: nginx-proxy
    image: nginx:latest
    restart: unless-stopped
    ports:
      # The single entry point for all web traffic
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - pihole
      - portainer
      - pocketbase
      - memos
      - bentopdf
    extra_hosts:
      - "host.docker.internal:host-gateway"

  pocketbase:
    container_name: pocketbase
    image: ghcr.io/muchobien/pocketbase:latest
    restart: unless-stopped
    environment:
      - PB_ADMIN_EMAIL=${ADMIN_EMAIL}
      - PB_ADMIN_PASSWORD=${ADMIN_PASSWORD}
    volumes:
      - /var/lib/pocketbase/pb_data:/pb_data
      - /var/lib/pocketbase/pb_public:/pb_public
      - /var/lib/pocketbase/pb_migrations:/pb_migrations
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:8090/api/health",
        ]
      interval: 10s
      timeout: 5s
      retries: 3

  memos:
    image: neosmemo/memos:stable
    container_name: memos
    restart: unless-stopped
    volumes:
      - /mnt/usb1/memos:/var/opt/memos
    environment:
      MEMOS_PORT: 5230
      MEMOS_DRIVER: sqlite
      MEMOS_INSTANCE_URL: http://memo.pi

  bentopdf:
    image: bentopdf/bentopdf:latest
    container_name: bentopdf
    restart: unless-stopped

volumes:
  portainer_data:
    name: portainer_data

networks:
  default:
    name: portainer_network
